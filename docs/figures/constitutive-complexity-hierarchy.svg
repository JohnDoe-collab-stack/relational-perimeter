<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">Constitutive complexity hierarchy</title>
  <desc id="desc">The executed relational role history produces an authoritative typed program with n instructions. The program recursively generates a complete duplicate-free extensive frontier of two to the n profiles. Independent finite addressing of these program profiles requires at least two to the n slots. Every expanded profile has a positively constructed accepted payload, and the same program interprets it exactly. A state-and-quantity readout is a downstream projection of the total instruction action and cannot reconstruct that total action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="constitutive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183b56"/>
      <stop offset="1" stop-color="#245979"/>
    </linearGradient>
    <linearGradient id="program" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d766e"/>
      <stop offset="1" stop-color="#15958a"/>
    </linearGradient>
    <linearGradient id="extensive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4b12"/>
      <stop offset="1" stop-color="#aa6c20"/>
    </linearGradient>
    <linearGradient id="addressing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71365d"/>
      <stop offset="1" stop-color="#984d7d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#40576a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6e8190"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, sans-serif; fill: #17324a; }
      .subtitle { font: 400 17px Inter, Segoe UI, sans-serif; fill: #526979; }
      .layer { font: 700 21px Inter, Segoe UI, sans-serif; fill: #fff; }
      .metric { font: 700 20px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #fff; }
      .bodyLight { font: 400 16px Inter, Segoe UI, sans-serif; fill: #eef8fb; }
      .body { font: 400 16px Inter, Segoe UI, sans-serif; fill: #334e60; }
      .small { font: 400 14px Inter, Segoe UI, sans-serif; fill: #526979; }
      .label { font: 700 15px Inter, Segoe UI, sans-serif; fill: #40576a; }
      .sideTitle { font: 700 18px Inter, Segoe UI, sans-serif; fill: #29465b; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #29465b; }
    </style>
  </defs>

  <rect width="1400" height="1020" fill="url(#background)"/>
  <text x="70" y="65" class="title">Constitutive complexity hierarchy</text>
  <text x="70" y="96" class="subtitle">One typed production chain, followed by two explicitly delimited representation boundaries</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="850" height="145" rx="18" fill="url(#constitutive)"/>
    <text x="105" y="185" class="layer">1 · Executed relational constitution</text>
    <text x="105" y="220" class="bodyLight">Dependent role history; every stage carries the produced state, discovery, provenance,</text>
    <text x="105" y="246" class="bodyLight">typed transport witness, and the exact code returned by execution.</text>
    <text x="690" y="260" class="metric">n = input + 1 stages</text>
  </g>

  <path d="M495 290 L495 350" stroke="#40576a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="327" class="label">buildConstitutiveNormalizerProgram</text>

  <g filter="url(#shadow)">
    <rect x="70" y="365" width="850" height="165" rx="18" fill="url(#program)"/>
    <text x="105" y="405" class="layer">2 · Authoritative typed operational program</text>
    <text x="105" y="441" class="bodyLight">One instruction per executed opening; each instruction is indexed by its actual endpoints</text>
    <text x="105" y="467" class="bodyLight">and denotes a total acceptance-preserving action on arbitrary continuations.</text>
    <text x="105" y="503" class="metric">instructionCount = codeSize = compiledLocalSize = n</text>
  </g>

  <path d="M495 530 L495 590" stroke="#40576a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="568" class="label">program.profileFrontier · recursive binary expansion</text>

  <g filter="url(#shadow)">
    <rect x="70" y="605" width="850" height="165" rx="18" fill="url(#extensive)"/>
    <text x="105" y="645" class="layer">3 · Complete extensive profile deployment</text>
    <text x="105" y="681" class="bodyLight">StructuralObligation is the canonical program’s Profile type. The frontier is the</text>
    <text x="105" y="707" class="bodyLight">program’s own complete, duplicate-free expansion, not a parallel carrier.</text>
    <text x="105" y="743" class="metric">profileWidth = 2^instructionCount = 2^n</text>
  </g>

  <path d="M495 770 L495 830" stroke="#40576a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="808" class="label">injective finite slot assignment</text>

  <g filter="url(#shadow)">
    <rect x="70" y="845" width="850" height="120" rx="18" fill="url(#addressing)"/>
    <text x="105" y="886" class="layer">4 · Independent finite addressing boundary</text>
    <text x="105" y="922" class="bodyLight">Every program-produced profile remains independently recoverable.</text>
    <text x="650" y="938" class="metric">slotCount ≥ 2^n</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="985" y="165" width="345" height="245" rx="18" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <text x="1015" y="205" class="sideTitle">Operational sufficiency</text>
    <text x="1015" y="241" class="body">Every expanded profile has a</text>
    <text x="1015" y="267" class="body">positively constructed accepted</text>
    <text x="1015" y="293" class="body">payload. The same typed program</text>
    <text x="1015" y="319" class="body">interprets it exactly.</text>
    <text x="1015" y="354" class="code">interpret(program, profile)</text>
    <text x="1015" y="382" class="code">= canonical normalization</text>
  </g>
  <path d="M920 445 C960 445 950 288 985 288" stroke="#6e8190" stroke-width="3" fill="none" marker-end="url(#arrowSoft)"/>
  <path d="M920 675 C960 675 950 360 985 360" stroke="#6e8190" stroke-width="3" fill="none" marker-end="url(#arrowSoft)"/>

  <g filter="url(#shadow)">
    <rect x="985" y="510" width="345" height="310" rx="18" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <text x="1015" y="550" class="sideTitle">Downstream extensional readout</text>
    <text x="1015" y="586" class="body">The state-and-quantity view</text>
    <text x="1015" y="612" class="body">is projected from the total</text>
    <text x="1015" y="638" class="body">authoritative instruction action.</text>
    <line x1="1015" y1="664" x2="1298" y2="664" stroke="#d6e0e7" stroke-width="2"/>
    <text x="1015" y="700" class="body">Equal projected views can carry</text>
    <text x="1015" y="726" class="body">different actions on another</text>
    <text x="1015" y="752" class="body">admissible continuation.</text>
    <text x="1015" y="790" class="code">projection ≠ reconstruction</text>
  </g>
  <path d="M920 475 C955 475 952 585 985 585" stroke="#6e8190" stroke-width="3" fill="none" marker-end="url(#arrowSoft)"/>

  <text x="70" y="1000" class="small">Exact scope: production order and finite independent-addressing lower bound; no universal time or memory lower bound.</text>
</svg>
