name: Final repository-gate validation

on:
  push:
    branches:
      - codex/operational-stability-final-repository-gates
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false

      - name: Verify executable bit
        shell: bash
        run: |
          test -x scripts/verify.sh
          test "$(git ls-files -s scripts/verify.sh | awk '{print $1}')" = "100755"

      - name: Clean public build with zero warnings
        shell: bash
        run: |
          set -o pipefail
          lake clean
          lake build +RelationalPerimeter 2>&1 | tee /tmp/public-build.log
          ! grep -F 'warning:' /tmp/public-build.log

      - name: Clean full build with zero warnings
        shell: bash
        run: |
          set -o pipefail
          lake clean
          lake build 2>&1 | tee /tmp/full-build.log
          ! grep -F 'warning:' /tmp/full-build.log

      - name: Run bash verifier directly
        shell: bash
        run: ./scripts/verify.sh

      - name: Run PowerShell verifier
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Regression rejects F6c production-theorem reversion
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/F6c.patch <<'PATCH'
          diff --git a/RelationalPerimeter/Computation/ConstitutiveSearch/EndogenousDecomposition/ExtensionalOperationalStability.lean b/RelationalPerimeter/Computation/ConstitutiveSearch/EndogenousDecomposition/ExtensionalOperationalStability.lean
          --- a/RelationalPerimeter/Computation/ConstitutiveSearch/EndogenousDecomposition/ExtensionalOperationalStability.lean
          +++ b/RelationalPerimeter/Computation/ConstitutiveSearch/EndogenousDecomposition/ExtensionalOperationalStability.lean
          @@ -310,12 +310,22 @@ theorem operational_action_not_factors_on_executed_system {depth : Nat}
               {assignment : SequentialAssignment depth}
               {state : ThreadedConstitutiveState depth assignment}
               {stage : SequentialStageRun depth assignment}
          -    (run : ThreadedConstitutiveStageRun state stage) :
          -    ¬ ActionFactorsThrough
          -      (executedTransportProjection run)
          -      (executedTransportAction run) :=
          -  action_not_factors_of_projection_collision
          -    (actionProjectionCollision run)
          +    (run : ThreadedConstitutiveStageRun state stage)
          +    (recover : ExtensionalOperationalStabilityView
          +      (generatedStructuralBranchSystem
          +        (distinctGrowingDiscoveryFormula
          +          (constructStage (depth + 1)).searchIndex)) →
          +      GeneratedStructuralBranchContinuation stage.schedule.entry.source →
          +      GeneratedStructuralBranchContinuation stage.schedule.entry.target)
          +    (recoversDiscovered : ∀ continuation,
          +      recover (executedTransportProjection run (discoveredTransport run)) continuation =
          +        (discoveredTransport run).map continuation)
          +    (recoversConstant : ∀ continuation,
          +      recover (executedTransportProjection run (observedConstantTransport run))
          +          continuation =
          +        (observedConstantTransport run).map continuation) : False :=
          +  different_total_action run
          +    ((recoversDiscovered _).symm.trans (recoversConstant _))
           
           end ExecutedExtensionalSeparator
           
          diff --git a/RelationalPerimeter/Computation/EndogenousOperationalDecomposition.lean b/RelationalPerimeter/Computation/EndogenousOperationalDecomposition.lean
          --- a/RelationalPerimeter/Computation/EndogenousOperationalDecomposition.lean
          +++ b/RelationalPerimeter/Computation/EndogenousOperationalDecomposition.lean
          @@ -227,8 +227,8 @@ theorem executed_state_width_view_does_not_determine_total_action {depth : Nat}
               ¬ ActionFactorsThrough
                 (ExecutedExtensionalSeparator.executedTransportProjection run)
                 (ExecutedExtensionalSeparator.executedTransportAction run) :=
          -  ExecutedExtensionalSeparator.operational_action_not_factors_on_executed_system
          -    run
          +  action_not_factors_of_projection_collision
          +    (ExecutedExtensionalSeparator.actionProjectionCollision run)
           
           /-- In the canonical initial-origin discovery associated with each input depth,
           at least nine tenths of the tested candidates belong to the proved failed
          PATCH
          git apply /tmp/F6c.patch
          set +e
          lake build > /tmp/f6c.log 2>&1
          status=$?
          set -e
          git restore --             RelationalPerimeter/Computation/ConstitutiveSearch/EndogenousDecomposition/ExtensionalOperationalStability.lean             RelationalPerimeter/Computation/EndogenousOperationalDecomposition.lean
          if [ "$status" -eq 0 ]; then
            cat /tmp/f6c.log
            echo "F6c unexpectedly survived the frozen regression suite" >&2
            exit 1
          fi
          grep -F 'productionExecutedNonFactorizationHasAbstractType' /tmp/f6c.log

      - name: Bash verifier rejects a Lean warning
        shell: bash
        run: |
          set -euo pipefail
          target=RelationalPerimeter/Computation/ConstitutiveSearch/SearchSystem.lean
          python3 - <<'PY'
          from pathlib import Path
          path = Path("RelationalPerimeter/Computation/ConstitutiveSearch/SearchSystem.lean")
          text = path.read_text()
          marker = "/- AXIOM_AUDIT_BEGIN -/"
          assert marker in text
          text = text.replace(marker, "def verificationWarningProbe : True := True.intro\n\n" + marker, 1)
          path.write_text(text)
          PY
          set +e
          ./scripts/verify.sh > /tmp/warning-sh.log 2>&1
          status=$?
          set -e
          git restore -- "$target"
          if [ "$status" -eq 0 ]; then
            cat /tmp/warning-sh.log
            echo "bash verifier unexpectedly accepted a Lean warning" >&2
            exit 1
          fi
          grep -F 'Lean warning detected in lake build output' /tmp/warning-sh.log

      - name: PowerShell verifier rejects a Lean warning
        shell: bash
        run: |
          set -euo pipefail
          target=RelationalPerimeter/Computation/ConstitutiveSearch/SearchSystem.lean
          python3 - <<'PY'
          from pathlib import Path
          path = Path("RelationalPerimeter/Computation/ConstitutiveSearch/SearchSystem.lean")
          text = path.read_text()
          marker = "/- AXIOM_AUDIT_BEGIN -/"
          assert marker in text
          text = text.replace(marker, "def verificationWarningProbe : True := True.intro\n\n" + marker, 1)
          path.write_text(text)
          PY
          set +e
          pwsh -File scripts/verify.ps1 > /tmp/warning-ps.log 2>&1
          status=$?
          set -e
          git restore -- "$target"
          if [ "$status" -eq 0 ]; then
            cat /tmp/warning-ps.log
            echo "PowerShell verifier unexpectedly accepted a Lean warning" >&2
            exit 1
          fi
          grep -F 'Lean warning detected in lake build output' /tmp/warning-ps.log

      - name: Final integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          cp lake-manifest.json /tmp/lake-manifest.before.json
          lake update
          cmp /tmp/lake-manifest.before.json lake-manifest.json
          echo "Lean files: $(find . -path './.lake' -prune -o -name '*.lean' -print | wc -l)"
