name: Constitution toolchain bootstrap
on:
  push:
    branches: [chatgpt/constitution-toolchain-bootstrap-20260929]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the pinned public distribution and verify its published digest
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          [[ "$toolchain" =~ ^leanprover/lean4:v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          asset="lean-${version}-linux.tar.zst"
          curl --fail --location --retry 3 "https://api.github.com/repos/leanprover/lean4/releases/tags/v${version}" -o "$RUNNER_TEMP/release.json"
          digest="$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); a=next(a for a in x["assets"] if a["name"]==sys.argv[2]); print(a.get("digest") or "")' "$RUNNER_TEMP/release.json" "$asset")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl --fail --location --retry 3 "https://github.com/leanprover/lean4/releases/download/v${version}/${asset}" -o "$RUNNER_TEMP/lean-linux.tar.zst"
          echo "${digest#sha256:}  $RUNNER_TEMP/lean-linux.tar.zst" | sha256sum --check
          printf '%s\n%s\n' "$toolchain" "$digest" > "$RUNNER_TEMP/toolchain-manifest.txt"
          split -b 400M "$RUNNER_TEMP/lean-linux.tar.zst" "$RUNNER_TEMP/lean-part-"
      - name: Export compiler part A (one-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-lean-linux-a
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lean-part-aa
            ${{ runner.temp }}/toolchain-manifest.txt
      - name: Export compiler part B (one-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-lean-linux-b
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/lean-part-ab
