name: Audit hardening validation

on:
  push:
    branches:
      - codex/operational-stability-audit-hardening
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
      - name: Verify
        run: bash scripts/verify.sh
